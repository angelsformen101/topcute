<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="canonical" href="https://topcutegirls.org/" />
  <meta name="robots" content="noindex, follow" />

    // Instant client-side redirect
    window.location.replace('/');
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0a0d14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .spinner {

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      color: #a1a1aa;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .home-btn {
      color: #ffffff;
      background-color: #d60f4b;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 9999px;
      transition: opacity 0.2s ease;
      display: inline-block;
    }
    .home-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
