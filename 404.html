<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Top Cute Girls...</title>
  <link rel="canonical" href="https://topcutegirls.org/" />
  <meta name="robots" content="noindex, follow" />
  
  <!-- Instant Redirection to Home Page -->
  <meta http-equiv="refresh" content="0; url=/">
  <script>
    // Instant client-side redirect
    window.location.replace('/');
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0a0d14;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(214, 15, 75, 0.2);
      border-top-color: #d60f4b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p {
      color: #a1a1aa;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }
    .home-btn {
      color: #ffffff;
      background-color: #d60f4b;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 9999px;
      transition: opacity 0.2s ease;
      display: inline-block;
    }
    .home-btn:hover {
      opacity: 0.9;
    }
  </style>

  <style>
    /* Prevent text selection and copying */
    body {
      -webkit-user-select: none; /* Safari */
      -ms-user-select: none; /* IE 10 and IE 11 */
      user-select: none; /* Standard syntax */
    }
  </style>
  <meta name='dmca-site-verification' content='QlpONWZMVmJPck8yZ0JzRUhRRzRuRCthZ0lQYlhocUV4TTRSdVBrRDg3az01' />
</head>
<body>
  <div class="spinner"></div>
  <h1>Page Not Found</h1>
  <p>Redirecting you to the home page...</p>
  <a href="/" class="home-btn">Go to Homepage</a>

  <script>
    // Prevent Right Click
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Prevent keyboard shortcuts
    document.addEventListener('keydown', function (event) {
      // Prevent F12
      if (event.key === 'F12' || event.keyCode === 123) {
        event.preventDefault();
        return false;
      }
      // Prevent Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+C, Ctrl+P, Ctrl+S
      if (event.ctrlKey) {
        if (event.shiftKey && (event.key === 'I' || event.key === 'J' || event.keyCode === 73 || event.keyCode === 74)) {
          event.preventDefault();
          return false;
        }
        if (event.key === 'U' || event.keyCode === 85 || 
            event.key === 'C' || event.keyCode === 67 || 
            event.key === 'P' || event.keyCode === 80 || 
            event.key === 'S' || event.keyCode === 83) {
          event.preventDefault();
          return false;
        }
      }
      // Mac shortcuts
      if (event.metaKey) {
        if (event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C' || event.keyCode === 73 || event.keyCode === 74)) {
           event.preventDefault();
           return false;
        }
        if (event.altKey && (event.key === 'I' || event.keyCode === 73)) {
           event.preventDefault();
           return false;
        }
        if (event.key === 'U' || event.keyCode === 85 || 
            event.key === 'C' || event.keyCode === 67 || 
            event.key === 'P' || event.keyCode === 80 || 
            event.key === 'S' || event.keyCode === 83) {
          event.preventDefault();
          return false;
        }
      }
    });

    // Prevent drag and drop
    document.addEventListener('dragstart', event => event.preventDefault());
    
    // Prevent copy event
    document.addEventListener('copy', event => {
      event.preventDefault();
      if (event.clipboardData) {
          event.clipboardData.setData('text/plain', '');
      }
    });
    
    // Prevent cut event
    document.addEventListener('cut', event => event.preventDefault());

    // Additional mobile prevention
    document.documentElement.style.webkitTouchCallout = 'none';
  </script>
</body>
</html>
